# Spellmind's Windows installer and Linux AppImage (docs/milestone-3.md; Linux for issue #1, 2026-11-21). Modeled on NeverQuestAlone's
# app/desktop/electron-builder.yml (MIT; see NOTICE.md), much smaller: Windows only, unsigned.
#
# Inside app.asar the files keep the repo's layout, so main.mjs's '../../core/…' imports work the
# same packed as from source:
#   app/desktop/   main.mjs, worker.mjs, preload.cjs, renderer/, assets/
#   core/          the link, the AI, the screen-reading helper
#   addon/Spellmind/  the addon the app installs into WoW
#   prompts/       the AI's prompt
# Nothing runs from inside app.asar, so the helper (.exe) and the keychain binding (.node) are
# unpacked beside it (core/link/capture.mjs looks under app.asar.unpacked).
#
# Unsigned: Windows SmartScreen warns on the first run ("More info", then "Run anyway").

appId: gg.spellmind.app
productName: Spellmind
copyright: "Copyright © 2026 The Spellmind authors (MIT)"

directories:
  output: dist
  buildResources: assets

extraMetadata:
  main: app/desktop/main.mjs

asar: true

# Electron's fuses, flipped in the exe at build time (the security review; NeverQuestAlone's
# scripts/fuses.cjs flips the same): no running as plain Node, no NODE_OPTIONS or --inspect, the app only
# from app.asar, and app.asar checked against the hash built into the exe.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
asarUnpack:
  - "**/spellmind-capture.exe"
  - "**/capture_x11.py"
  - "**/*.node"

# English only: Chromium's other locale packs stay out.
electronLanguages:
  - en-US

files:
  - package.json
  - from: .
    to: app/desktop
    filter:
      - main.mjs
      - worker.mjs
      - preload.cjs
      - updater.mjs
      - renderer/**/*
      - assets/**/*
  - from: ../../core
    to: core
    filter:
      - "**/*.mjs"
      - "**/*.json"
      - capture/windows/build/spellmind-capture.exe
      - capture_x11.py
      - "!capture/build.mjs"
  - from: ../../addon/Spellmind
    to: addon/Spellmind
    filter:
      - "**/*.lua"
      - "**/*.toc"
      - "**/*.xml"
      - "**/*.tga"
  - from: ../../prompts
    to: prompts
    filter:
      - spellmind.md
  # The project's MIT notice and the list of what came from other projects.
  - from: ../..
    to: .
    filter:
      - LICENSE
      - NOTICE.md

# The update feed (updater.mjs): this repository's GitHub releases. electron-builder writes it into the
# build as app-update.yml; the release workflow uploads the files, never a local build (--publish never).
publish:
  provider: github
  owner: jcouser
  repo: spellmind
  releaseType: release

win:
  icon: assets/icon.ico
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  # The settings and log in %APPDATA%\Spellmind stay on uninstall (a reinstall finds them).
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}.${ext}"
  shortcutName: Spellmind
  # Close a running Spellmind by asking it to quit; remove its start-at-login entry on uninstall.
  include: installer.nsh
  # A per-user install never elevates: no elevate.exe (the security review).
  packElevateHelper: false

# Linux (issue #1): an AppImage, one file the player marks executable and runs; electron-updater replaces it
# in place when a new one is out. The screen reader is core/capture_x11.py (python3 and libX11, both on any
# desktop Linux), unpacked beside app.asar.
linux:
  icon: assets/icon.png
  category: Game
  target:
    - AppImage
  artifactName: "${productName}-${version}.${ext}"
  synopsis: Spellmind for WoW Forever
