# GitHub secret scanning: the key detector's tests are full of made-up, key-shaped strings (an
# alphabet run after sk-, "AIzaFAKE-not-a-real-google-key", ...) on purpose: they check that Spellmind
# refuses key-shaped text in game and in its logs. Scanning still covers everything else.
paths-ignore:
  - "tests/ai/**"
  - "tests/addon/link_test.mjs"
