# The tests on every push and pull request: the addon (in a Lua VM), the app's core and the link.
# No secrets, a read-only token, every action pinned to a commit.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: The addon zip builds
        run: node tools/package-addon.mjs

  # The Linux capture helper (core/capture_x11.py): its tests and the Codec.lua round trip need python3,
  # which the Windows job hasn't got.
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: python3 tests/link/capture_x11_test.py
      - run: node tests/link/codec_test.cjs
