# A release (docs/releasing.md): on a v* tag, from that commit,
#   1. the screen-reading helper, cross-compiled with the pinned Zig (twice, the same bytes);
#   2. the tests, then the Windows installer (with the helper inside) and the addon zip;
#   3. a DRAFT GitHub release with the installer, its update feed (latest.yml, the .blockmap), the
#      addon zip, the Linux AppImage and its feed (latest-linux.yml, built beside 2), and SHA256SUMS.txt. A person reads it and publishes it; the app's updater and the
#      download links only see published releases.
#
# Code signing (docs/releasing.md): with the repository variables SIGNPATH_ORGANIZATION_ID and
# SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN set (after SignPath Foundation approves the
# project), the installer goes to SignPath between 2 and 3, waits for a person to approve the request,
# and comes back signed; the update feed is then written again for the signed bytes. Without them,
# the installer is unsigned, as before.
#
# Hardening: no pull_request trigger; the build jobs have a read-only token, and the only secret is
# the SignPath token, used by SignPath's own action alone; only the release job can write, and it runs
# nothing from the repository; every action pinned to a commit.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  capture-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zig (pinned, its SHA-256 checked)
        run: bash core/capture/windows/fetch-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_ENV"
      - name: Build (twice, and refused unless both are the same bytes)
        run: bash core/capture/windows/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-helper
          path: core/capture/windows/build/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: capture-helper
    runs-on: windows-latest
    # The signing request can wait up to an hour for its approval.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # SignPath's action fetches the unsigned artifact through the API
    env:
      # Unsigned on purpose: electron-builder never signs with whatever a runner happens to hold.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag is the version the app and the addon say
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./app/desktop/package.json').version")
          toc=$(sed -n 's/^## Version: *//p' addon/Spellmind/Spellmind.toc | tr -d '\r')
          echo "tag $tag, app $app, addon $toc"
          [ "$tag" = "$app" ] && [ "$tag" = "$toc" ] || { echo "::error::the tag, app/desktop/package.json and Spellmind.toc must all say the same version"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm test
      # The roads players walk, merged (server/roads/README.md), into the addon the zip and the installer carry.
      # A release never waits on it: without the Worker, Roads.lua stays as committed.
      - name: The shared roads
        if: vars.ROADS_URL != ''
        continue-on-error: true
        env:
          ROADS_URL: ${{ vars.ROADS_URL }}
        run: node tools/roads-merge.mjs --fetch --lua addon/Spellmind/Roads.lua
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-helper
          path: core/capture/windows/build/
      - name: The installer
        working-directory: app/desktop
        run: |
          npm ci
          npx electron-builder --win nsis --publish never
          node scripts/hash.mjs
      # Signing: only once SignPath is set up (the variables above); every request is approved by hand
      # in SignPath (the code signing policy in the README).
      - name: The unsigned installer, for SignPath
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: app/desktop/dist/Spellmind-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Signed through SignPath Foundation (waits for the approval)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app/desktop/dist/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: The signed installer in place, checked, and the update feed written for it
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          v="${{ steps.version.outputs.version }}"
          mv -f "app/desktop/dist/signed/Spellmind-Setup-$v.exe" app/desktop/dist/
          rm -rf app/desktop/dist/signed
          status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature 'app/desktop/dist/Spellmind-Setup-$v.exe').Status")
          signer=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature 'app/desktop/dist/Spellmind-Setup-$v.exe').SignerCertificate.Subject")
          echo "signature: $status, $signer"
          [ "$(echo "$status" | tr -d '\r')" = "Valid" ] || { echo "::error::the signed installer's signature isn't valid"; exit 1; }
          node tools/update-feed.mjs app/desktop/dist
      - name: The addon zip
        run: node tools/package-addon.mjs --out app/desktop/dist
      - name: Checksums
        working-directory: app/desktop/dist
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha256sum "Spellmind-Setup-$v.exe" "Spellmind-$v.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            app/desktop/dist/Spellmind-Setup-*.exe
            app/desktop/dist/Spellmind-Setup-*.exe.blockmap
            app/desktop/dist/latest.yml
            app/desktop/dist/Spellmind-*.zip
            app/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # The Linux app (issue #1): an AppImage, its screen reader core/capture_x11.py. The same addon, with the
  # same shared roads, as the Windows build's.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag is the version the app says
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./app/desktop/package.json').version")
          [ "$tag" = "$app" ] || { echo "::error::the tag and app/desktop/package.json must say the same version"; exit 1; }
      - run: python3 tests/link/capture_x11_test.py
      - name: The shared roads
        if: vars.ROADS_URL != ''
        continue-on-error: true
        env:
          ROADS_URL: ${{ vars.ROADS_URL }}
        run: node tools/roads-merge.mjs --fetch --lua addon/Spellmind/Roads.lua
      - name: The AppImage
        working-directory: app/desktop
        run: |
          npm ci
          npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-files
          path: |
            app/desktop/dist/Spellmind-*.AppImage
            app/desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: files
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-files
          path: files
      - name: The AppImage in the checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd files && sha256sum "Spellmind-$v.AppImage" >> SHA256SUMS.txt)
      - name: A draft release, for a person to read and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "## Spellmind $v"
            echo
            echo "- **The app (Windows 10 and 11):** \`Spellmind-Setup-$v.exe\`. It installs the addon too."
            echo "- **The addon only:** \`Spellmind-$v.zip\`, unzipped into \`World of Warcraft\\_forever_\\Interface\\AddOns\`."
            echo "- **The app on Linux (preview):** \`Spellmind-$v.AppImage\`: make it executable and run it. It needs python3, and the game under X11 or XWayland (Proton's usual way)."
            echo
            echo "Check a download before running it ([how](https://github.com/$GH_REPO/blob/main/docs/install.md)). [Code signing policy](https://github.com/$GH_REPO#code-signing-policy)."
            echo
            echo '```'
            cat files/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Spellmind $v" --notes-file notes.md files/*
