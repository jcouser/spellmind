# A Linux preview of the app (issue #1), built by hand from any branch: Actions, "linux-preview", Run workflow.
# The AppImage is the run's artifact (a GitHub sign-in downloads it); nothing is released or published.
name: linux-preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: python3 tests/link/capture_x11_test.py
      - name: The AppImage
        working-directory: app/desktop
        run: |
          npm ci
          npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spellmind-linux-preview
          path: app/desktop/dist/Spellmind-*.AppImage
          if-no-files-found: error
          retention-days: 30
